# ─────────────────────────────────────────────────────────────────────────────
# HealThaali — continuous integration
#
# Ten gates, in the order a failure is cheapest to understand:
#
#   1. Install       `npm ci` from the committed lockfile
#   2. Typecheck     `astro check` — TypeScript + template diagnostics
#   3. Build         `astro build` → dist/
#   4. Check recipes the committed YouTube snapshot is valid and every
#                    recipe has its thumbnail on disk (offline; no network)
#   5. Check blog links
#                    every published post links to at least two others, and
#                    none of them is an orphan (reads the Markdown, not dist/)
#   6. Check blog dates
#                    no post is dated before the newest video it embeds, and
#                    every embedded id is one the recipe snapshot knows
#   7. Check placeholders
#                    no `[square-bracket]` scaffolding left in any built page
#   8. Check links   internal link, anchor, sitemap and robots integrity
#   9. Check weight  no built page may exceed its gzipped HTML/CSS/JS budget
#  10. Check a11y    axe-core must find no WCAG A/AA violation, on every page,
#                    in both the light and the dark colour scheme
#
# Every step runs the same npm script a developer runs locally, so CI cannot
# drift from the documented workflow: if it is green here, `npm run verify`
# passes on your machine.
#
# Node 22 is deliberate — it is the version `netlify.toml` pins for the real
# deployment, so CI tests the runtime the site actually ships on rather than
# the newest one available.
#
# No environment variables are set. Every PUBLIC_ value is optional by design,
# and with them all empty the build produces the honest "coming soon"
# placeholder state — which is exactly what should be verified.
#
# External link checking is NOT part of this pipeline: a 429 from Instagram
# must never turn a pull request red. Run `npm run check:links:external` by
# hand (or from a scheduled workflow) when you want live URLs probed.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes the run it replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads the repository.
permissions:
  contents: read

defaults:
  run:
    # The website is a project inside the repository, not the repository root.
    working-directory: website

jobs:
  verify:
    name: Build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # `cache` needs the lockfile path explicitly, because package.json is
          # not at the repository root.
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Separate from the build so a type error reports as "Typecheck" rather
      # than as a generic build failure. `npm run build` runs `astro check`
      # again on purpose — keeping the documented build command as the one
      # true source of truth is worth the few duplicated seconds.
      - name: Typecheck
        run: npm run check

      # Offline and instant. The build validates the same snapshot, but this
      # reports which recipe is wrong instead of failing mid-build.
      - name: Check recipe data
        run: npm run check:recipes

      # Also source-level and instant. It reads the Markdown rather than dist/,
      # so a post that links nowhere is named by its own file, and the whole
      # link graph is printed while the run is still cheap to interrupt.
      - name: Check blog internal links
        run: npm run check:blog-links

      # Source-level too, and just as cheap. A post is dated to follow the video
      # it explains, so a date earlier than that video's upload is a claim the
      # page cannot support. Both files are named in the failure.
      - name: Check blog dates
        run: npm run check:blog-dates

      - name: Build the static site
        run: npm run build

      # Fails on any `[bracketed]` placeholder in the built pages. Cheap and
      # text-only, so it runs before the browser-based audits.
      - name: Check for leftover placeholders
        run: npm run check:placeholders

      - name: Check links in the built site
        run: npm run check:links

      # Deterministic and instant, so it runs before the browser-based audit:
      # performance regressions show up in bytes long before they show up in a
      # score, and a score is too dependent on the runner's CPU to gate on.
      - name: Check page weight
        run: npm run check:weight

      # Serves dist/ itself and auto-discovers every page, so new pages are
      # covered without touching scripts/check-a11y.mjs. Chrome is the one
      # already installed on the runner; no browser is downloaded.
      - name: Check accessibility
        run: npm run check:a11y
